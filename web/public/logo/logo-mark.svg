<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Very Transparent Healthcare">
  <defs>
    <linearGradient id="vth-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#914BFA"/>
      <stop offset="1" stop-color="#5C3FD0"/>
    </linearGradient>
  </defs>
  <!-- Four translucent petals form a care "plus"; overlaps show through (transparency) -->
  <g fill="url(#vth-g)" fill-opacity="0.42">
    <circle cx="32" cy="17" r="15"/>
    <circle cx="47" cy="32" r="15"/>
    <circle cx="32" cy="47" r="15"/>
    <circle cx="17" cy="32" r="15"/>
  </g>
  <!-- The patient, at the centre of it all -->
  <circle cx="32" cy="32" r="8.5" fill="#5C3FD0" stroke="#FFFFFF" stroke-width="3"/>
</svg>
