    <path d="M112 116 c6 6 16 6 22 0" stroke="#5C3FD0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path transform="translate(58 56) scale(1.1)" d="M0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" fill="#914BFA"/>
