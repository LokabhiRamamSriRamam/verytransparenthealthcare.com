    <g transform="rotate(-30 194 130)">
      <rect x="164" y="120" width="60" height="20" rx="10" fill="#FFB59E"/>
      <rect x="184" y="120" width="20" height="20" fill="#F08A6C"/>
    </g>
    <path transform="translate(46 60) scale(1.2)" d="M0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" fill="#4CAF6E"/>
    <path transform="translate(196 40) scale(1)" d="M0 -8 C 1 -2 2 -1 8 0 C 2 1 1 2 0 8 C -1 2 -2 1 -8 0 C -2 -1 -1 -2 0 -8 Z" fill="#FFB59E"/>
  </g>
</svg>
