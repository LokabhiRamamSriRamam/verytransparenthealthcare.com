    <rect x="130" y="56" width="62" height="104" rx="12" fill="#191919"/>
    <rect x="136" y="64" width="50" height="88" rx="7" fill="#FFFFFF"/>
    <rect x="142" y="74" width="32" height="11" rx="5.5" fill="#EEE5FF"/>
    <rect x="152" y="92" width="28" height="11" rx="5.5" fill="#5C3FD0"/>
    <rect x="142" y="110" width="36" height="11" rx="5.5" fill="#EEE5FF"/>
