<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="A weekly pill organiser with a completed check mark">
  <title>A weekly pill organiser with a completed check mark</title>
  <defs>
