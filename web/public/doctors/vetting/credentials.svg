    <path d="M150 118 l6 32 l-10 -6 l-6 10 l-4 -30 z" fill="#5C3FD0"/>
    <circle cx="143" cy="116" r="16" fill="#5C3FD0"/>
    <circle cx="143" cy="116" r="9" fill="#D8C8FF"/>
    <circle cx="192" cy="46" r="22" fill="#4CAF6E"/>
